<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CodeScape Sandbox</title>
  <style>
    body {
      background: #111;
      color: #888;
      font-family: monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      overflow: hidden;
    }

    .loader {
      width: 20px;
      height: 20px;
      border: 2px solid #333;
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <!-- Default Loading State -->
  <div class="loader"></div>
  <script>
    ; (async function () {
      // DEBUG: Scream existence
      // window.alert("Bootloader JS is Running!");
      // Commented out alert to avoid annoying popups, using console only now.
      // Wait, user said "I don't see anything". I NEED the alert.

      const ID = Math.floor(Math.random() * 1000)

      const PARENT_ORIGIN = "*"

      const nativeConsole = {
        log: console.log.bind(console),
        warn: console.warn.bind(console),
        error: console.error.bind(console)
      }

      const sys = {
        log: (...args) => nativeConsole.log(...args),
        warn: (...args) => nativeConsole.warn(...args),
        error: (...args) => nativeConsole.error(...args)
      }

      // Proxy User Console to Parent
      function proxyUserConsole() {
        let logCount = 0
        let lastReset = Date.now()
        const LOG_LIMIT = 50 // max logs per sec

        // Duplicate Suppression
        const DUP_WINDOW = 60 // ms (Optimized for 60fps loops)
        const lastLogs = new Map() // content -> timestamp

        function send(level, args) {
          const now = Date.now()

          // 1. Rate Limit Reset
          if (now - lastReset > 1000) {
            logCount = 0
            lastReset = now
          }

          // 2. Rate Limit Enforcement
          if (logCount > LOG_LIMIT) {
            if (logCount === LOG_LIMIT + 1) {
              // Send one warning
              window.parent.postMessage({
                type: "SANDBOX_LOG",
                level: "warn",
                payload: ["[Sandbox] Log limit exceeded (50/s). Suppression active."]
              }, PARENT_ORIGIN)
            }
            // Still log to native for devtools
            nativeConsole[level](...args)
            return
          }

          // 3. Duplicate Suppression
          // Dedupe ALL levels (log/warn/error) within 60ms.
          // This catches machine loops (p5 spam) but allows human clicks (>100ms interval).
          const contentKey = args.map(String).join(' ')
          if (lastLogs.has(contentKey)) {
            if (now - lastLogs.get(contentKey) < DUP_WINDOW) {
              // Skip duplicate
              lastLogs.set(contentKey, now)
              return
            }
          }
          lastLogs.set(contentKey, now)

          // Garbage collect map occasionally
          if (lastLogs.size > 1000) lastLogs.clear()

          const payload = args.map((a) => {
            try {
              return typeof a === "object" ? JSON.stringify(a) : String(a)
            } catch (e) {
              return String(a)
            }
          })

          logCount++
          window.parent.postMessage({ type: "SANDBOX_LOG", level, payload }, PARENT_ORIGIN)

          // Also log to native for debugging
          nativeConsole[level](...args)
        }

        console.log = (...args) => send("log", args)
        console.warn = (...args) => send("warn", args)
        console.error = (...args) => send("error", args)
      }
      proxyUserConsole()

      // Capture Global Errors
      window.onerror = function (msg, url, lineNo, columnNo, error) {
        const errorInfo = [
          msg,
          `@ ${url?.split("/").pop() || "unknown"}:${lineNo}:${columnNo}`
        ]
        // Send directly via console.error proxy logic? 
        // No, console.error is already proxied.
        // We can just call console.error(msg, error) effectively.
        console.error("Uncaught Error:", ...errorInfo)
        return false // Don't suppress default browser error
      }

      // Capture Unhandled Promise Rejections
      window.addEventListener("unhandledrejection", function (event) {
        console.error("Unhandled Rejection:", event.reason)
      })

      sys.log(`[Bootloader ${ID}] Starting...`)

      if (!("serviceWorker" in navigator)) {
        sys.error(`[Bootloader ${ID}] No Service Worker Support`)
        return
      }

      try {
        sys.log(`[Bootloader ${ID}] Registering SW...`)
        // Explicitly requesting sw.js
        const reg = await navigator.serviceWorker.register("./sw.js", { scope: "./" })

        sys.log(`[Bootloader ${ID}] Waiting for Ready...`)
        await navigator.serviceWorker.ready

        // Ensure we are controlled before proceeding
        if (!navigator.serviceWorker.controller) {
          sys.warn(`[Bootloader ${ID}] No controller found. Reloading to acquire...`)
          window.location.reload()
          return
        }

        sys.log(`[Bootloader ${ID}] SW Ready! Broadcasting SANDBOX_READY...`)
        window.parent.postMessage({ type: "SANDBOX_READY" }, PARENT_ORIGIN)

        window.addEventListener("message", async (event) => {
          if (!event.data) return

          if (event.data.type === "COMPILE_FILES") {
            const { scapeId, files, env } = event.data.payload
            sys.log(`[Bootloader ${ID}] Compiling ${scapeId}...`)
            sys.log(
              `[Bootloader ${ID}] Files received:`,
              files.map((f) => f.name)
            )
            sys.log(`[Bootloader ${ID}] Env received:`, env ? Object.keys(env) : "NONE")

            const sw = navigator.serviceWorker.controller
            if (!sw) {
              sys.error(`[Bootloader ${ID}] No SW Controller. Forcing reload...`)
              window.location.reload()
              return
            }

            const channel = new MessageChannel()
            channel.port1.onmessage = (e) => {
              if (e.data.type === "ACK") {
                sys.log(`[Bootloader ${ID}] Redirecting...`)
                window.location.replace(`./run/${scapeId}/index.html`)
              }
            }

            sw.postMessage(
              {
                type: "HYDRATE",
                payload: { scapeId, files, env },
              },
              [channel.port2]
            )
          }
        })
      } catch (e) {
        sys.error(`[Bootloader ${ID}] Critical Error:`, e)
        document.body.innerHTML = "<h1>Sandbox Error</h1><pre>" + e.message + "</pre>"
      }
    })()
  </script>
</body>

</html>

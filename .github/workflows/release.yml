name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
        
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          
      - name: Install Dependencies
        run: npm ci
        
      # Linux specific setup (if needed for electron)
      # Usually github runners have libraries, but sometimes libicns is needed
        
      - name: Build & Release (macOS)
        if: matrix.os == 'macos-latest'
        run: npm run electron:build -- --mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Build & Release (Windows)
        if: matrix.os == 'windows-latest'
        run: npm run electron:build -- --win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Build & Release (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: npm run electron:build -- --linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      # Upload Artifacts (Optional, Electron Builder usually releases to GitHub Releases if GH_TOKEN is present)
      # But standard actions/upload-artifact helps debug if not releasing to GitHub
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts-${{ matrix.os }}
          path: release/*
